<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('党史标题管理列表')"/>
</head>
<body class="gray-bg">
<div class="container-div">
    <div class="row">
        <div class="col-sm-12 search-collapse">
            <form id="formId">
                <div class="select-list">
                    <ul>
                        <li>
                            <label>标题：</label>
                            <input type="text" name="title"/>
                        </li>
<!--                        <li>-->
<!--                            <label>父部门id：</label>-->
<!--                            <input type="text" name="parentId"/>-->
<!--                        </li>-->
                        <li>
                            <label>简介：</label>
                            <input type="text" name="briefIntroduction"/>
                        </li>
<!--                        <li>-->
<!--                            <label>祖级列表：</label>-->
<!--                            <input type="text" name="ancestors"/>-->
<!--                        </li>-->
                        <li>
                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.treeTable.search()"><i
                                    class="fa fa-search"></i>&nbsp;搜索</a>
                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i
                                    class="fa fa-refresh"></i>&nbsp;重置</a>
                        </li>
                    </ul>
                </div>
            </form>
        </div>

        <div class="btn-group-sm" id="toolbar" role="group">
            <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="front:title:add">
                <i class="fa fa-plus"></i> 新增
            </a>
            <a class="btn btn-primary" onclick="$.operate.edit()" shiro:hasPermission="front:title:edit">
                <i class="fa fa-edit"></i> 修改
            </a>
            <a class="btn btn-info" id="expandAllBtn">
                <i class="fa fa-exchange"></i> 展开/折叠
            </a>
        </div>
        <div class="col-sm-12 select-table table-striped">
            <table id="bootstrap-tree-table"></table>
        </div>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script th:inline="javascript">
    var addFlag = [[${@permission.hasPermi('front:title:add')}]];
    var editFlag = [[${@permission.hasPermi('front:title:edit')}]];
    var removeFlag = [[${@permission.hasPermi('front:title:remove')}]];
    var prefix = ctx + "front/title";

    $(function () {
        var options = {
            code: "id",
            parentCode: "parentId",
            expandColumn: "1",
            uniqueId: "id",
            url: prefix + "/list",
            createUrl: prefix + "/add/{id}",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove/{id}",
            modalName: "党史标题管理",
            columns: [{
                field: 'selectItem',
                radio: true
            },
                {
                    field: 'title',
                    title: '小标题、时期',
                    align: 'left'
                },
                {
                    field: 'parentId',
                    title: '父部门id',
                    align: 'c'
                },
                {
                    field: 'briefIntroduction',
                    title: '简介',
                    align: 'left',
                    formatter: function (value, row, index) {
                        var maxLength = 20; // 定义最大显示长度
                        if (value && value.length > maxLength) {
                            var shortText = value.substring(0, maxLength) + '...';
                            return '<span title="' + value + '">' + shortText + '</span>';
                        }
                        return value;
                    }
                },
                // {
                //     field: 'ancestors',
                //     title: '祖级列表',
                //     align: 'left'
                // },
                {
                    title: '操作',
                    align: 'left',
                    // align: 'left',
                    formatter: function (value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-info  btn-xs ' + addFlag + '" href="javascript:void(0)" onclick="$.operate.add(\'' + row.id + '\')"><i class="fa fa-plus"></i>新增</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
        };
        $.treeTable.init(options);
    });
</script>
</body>
</html>
